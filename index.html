<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>给你的心意</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      color: white;
      padding: 30px;
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 90%;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    #text {
      font-size: 18px;
      line-height: 1.8;
      min-height: 120px;
    }

    .btns {
      margin-top: 30px;
    }

    button {
      padding: 12px 25px;
      margin: 10px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    #yes {
      background: white;
      color: #ff6b81;
    }

    #no {
      background: rgba(255,255,255,0.3);
      color: white;
      position: absolute;
    }

    button:hover {
      transform: scale(1.1);
    }

    .heart {
      position: absolute;
      color: red;
      font-size: 20px;
      animation: float 5s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-800px) scale(1.5); opacity: 0; }
    }

    #final {
      display: none;
      font-size: 24px;
      margin-top: 20px;
      font-weight: bold;
    }

  </style>
</head>

<body>

<div class="container">
  <h1>我想认真对你说一件事</h1>
  <div id="text"></div>

  <div class="btns" id="buttons" style="display:none;">
    <button id="yes" onclick="accept()">我愿意</button>
    <button id="no" onmouseover="moveButton()">再想想</button>
  </div>

  <div id="final">❤️ 那我们就正式在一起吧 ❤️</div>
</div>

<script>
  const words = [
    "有些话，如果现在不说，可能以后就没有合适的时机了。",
    "和你相处的这些日子，我其实一直在偷偷开心。",
    "你的笑、你的语气，甚至是一些小习惯，都会让我反复想起。",
    "我不太擅长表达，但我很确定一件事：",
    "我喜欢你。",
    "不是一时兴起，是认真想过以后，依然想靠近你。"
  ];

  let i = 0;
  const textDiv = document.getElementById("text");

  function typing() {
    if (i < words.length) {
      textDiv.innerHTML += words[i] + "<br><br>";
      i++;
      setTimeout(typing, 1200);
    } else {
      document.getElementById("buttons").style.display = "block";
    }
  }

  typing();

  function accept() {
    document.getElementById("buttons").style.display = "none";
    document.getElementById("final").style.display = "block";
    createHearts();
  }

  function moveButton() {
    const btn = document.getElementById("no");
    btn.style.top = Math.random() * window.innerHeight + "px";
    btn.style.left = Math.random() * window.innerWidth + "px";
  }

  function createHearts() {
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.top = "100vh";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }, 300);
  }
</script>

</body>
</html>
